name: 'dbt_core'
version: '1.0.0'
config-version: 2

# Profile used to connect to the data warehouse
profile: 'dbt_core'

# Project paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Seeds configuration
seeds:
  dbt_core:
    +schema: raw
    raw_hospital_events:
      +quote_columns: false
    activity_reference:
      +quote_columns: false

# Model materialization configuration
models:
  dbt_core:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
